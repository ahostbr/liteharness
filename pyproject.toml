[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liteharness"
version = "0.4.3"
description = "Portable cross-CLI agent orchestration. Hook-polled inbox, conversation discovery, task tracking."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]
authors = [{ name = "Ryan Devlin", email = "ryan@litesuite.dev" }]
maintainers = [{ name = "Ryan Devlin", email = "ryan@litesuite.dev" }]
keywords = ["ai", "agents", "orchestration", "claude", "gemini", "codex", "mcp", "multi-agent", "cli", "pty"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
  "Topic :: Terminals",
]

[project.urls]
Homepage = "https://litesuite.dev/liteharness"
Documentation = "https://litesuite.dev/liteharness"
Repository = "https://github.com/ahostbr/liteharness"
Issues = "https://github.com/ahostbr/liteharness/issues"
Changelog = "https://github.com/ahostbr/liteharness/blob/main/CHANGELOG.md"

[project.scripts]
liteharness = "liteharness.cli:main"

[project.optional-dependencies]
embed = ["onnxruntime>=1.18.0", "numpy>=1.26.0", "huggingface_hub>=0.23.0", "tokenizers>=0.19.0"]

[tool.setuptools.packages.find]
include = ["liteharness*"]

[tool.setuptools.package-data]
liteharness = [
  "hooks_configs/*.json",
  "tier_cards.json",
  "hooks_configs/*.ts",
  "cli_scripts/**/*.py",
  "cli_scripts/**/*.md",
  "ps_scripts/*.ps1",
  "catalog/PROVENANCE.json",
  "catalog/skills/**/*",
  "catalog/agents/**/*",
  "catalog/commands/**/*",
  "catalog/hooks/**/*",
]
# 🔴 catalog/ gained an __init__.py (it had none, which is why `liteharness.catalog` was a
# namespace package and `liteharness install` could never import from it). That makes it a
# package in its OWN right, so `packages.find` now discovers `liteharness.catalog` and the
# globs above — which are relative to the `liteharness` package — no longer necessarily
# reach inside it. Declaring the data under BOTH keys means fixing the module cannot
# silently stop the ~380 data files from shipping. Verified by listing the built wheel, not
# by reading this config.
"liteharness.catalog" = [
  "PROVENANCE.json",
  "skills/**/*",
  "agents/**/*",
  "commands/**/*",
  "hooks/**/*",
]

# The catalog globs are recursive, so anything sitting in a skill directory on
# the build machine ships. 0.2.2 and 0.2.3 both carried stray __pycache__/*.pyc
# picked up from local runs.
# ASCII letter classes make the precise runtime families explicit on POSIX too.
# fnmatch '*' spans separators: suffix patterns cover catalog root and all depths.
# Marker/lock/cache components require separate root and nested patterns.
# Actual release artifacts must still pass complete raw payload verification.
[tool.setuptools.exclude-package-data]
liteharness = [
  "catalog/*.[pP][yY][cC]",
  "catalog/*.[dD][bB]",
  "catalog/*.[sS][qQ][lL][iI][tT][eE]",
  "catalog/*.[sS][qQ][lL][iI][tT][eE]3",
  "catalog/*.[dD][bB]-[wW][aA][lL]",
  "catalog/*.[dD][bB]-[sS][hH][mM]",
  "catalog/*.[dD][bB]-[jJ][oO][uU][rR][nN][aA][lL]",
  "catalog/*.[sS][qQ][lL][iI][tT][eE]-[wW][aA][lL]",
  "catalog/*.[sS][qQ][lL][iI][tT][eE]-[sS][hH][mM]",
  "catalog/*.[sS][qQ][lL][iI][tT][eE]-[jJ][oO][uU][rR][nN][aA][lL]",
  "catalog/*.[sS][qQ][lL][iI][tT][eE]3-[wW][aA][lL]",
  "catalog/*.[sS][qQ][lL][iI][tT][eE]3-[sS][hH][mM]",
  "catalog/*.[sS][qQ][lL][iI][tT][eE]3-[jJ][oO][uU][rR][nN][aA][lL]",
  "catalog/.[lL][aA][sS][tT]_[iI][nN][dD][eE][xX][eE][dD]",
  "catalog/*/.[lL][aA][sS][tT]_[iI][nN][dD][eE][xX][eE][dD]",
  "catalog/[iI][nN][dD][eE][xX].[lL][oO][cC][kK]",
  "catalog/*/[iI][nN][dD][eE][xX].[lL][oO][cC][kK]",
  "catalog/__[pP][yY][cC][aA][cC][hH][eE]__/*",
  "catalog/*/__[pP][yY][cC][aA][cC][hH][eE]__/*",
]
"liteharness.catalog" = [
  "*.[pP][yY][cC]",
  "*.[dD][bB]",
  "*.[sS][qQ][lL][iI][tT][eE]",
  "*.[sS][qQ][lL][iI][tT][eE]3",
  "*.[dD][bB]-[wW][aA][lL]",
  "*.[dD][bB]-[sS][hH][mM]",
  "*.[dD][bB]-[jJ][oO][uU][rR][nN][aA][lL]",
  "*.[sS][qQ][lL][iI][tT][eE]-[wW][aA][lL]",
  "*.[sS][qQ][lL][iI][tT][eE]-[sS][hH][mM]",
  "*.[sS][qQ][lL][iI][tT][eE]-[jJ][oO][uU][rR][nN][aA][lL]",
  "*.[sS][qQ][lL][iI][tT][eE]3-[wW][aA][lL]",
  "*.[sS][qQ][lL][iI][tT][eE]3-[sS][hH][mM]",
  "*.[sS][qQ][lL][iI][tT][eE]3-[jJ][oO][uU][rR][nN][aA][lL]",
  ".[lL][aA][sS][tT]_[iI][nN][dD][eE][xX][eE][dD]",
  "*/.[lL][aA][sS][tT]_[iI][nN][dD][eE][xX][eE][dD]",
  "[iI][nN][dD][eE][xX].[lL][oO][cC][kK]",
  "*/[iI][nN][dD][eE][xX].[lL][oO][cC][kK]",
  "__[pP][yY][cC][aA][cC][hH][eE]__/*",
  "*/__[pP][yY][cC][aA][cC][hH][eE]__/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
